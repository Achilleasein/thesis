name: Build executables

# Builds standalone CLI executables of rhythm_detection.py for Linux, macOS and
# Windows. PyInstaller cannot cross-compile, so each binary is built on its own
# native runner. Trigger manually from the Actions tab, or push a tag like
# "v1.0.0" to also publish the binaries as a GitHub Release.
on:
  workflow_dispatch:
  push:
    branches:
      - main
    tags:
      - "v*"

jobs:
  build:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # soundfile ships libsndfile in its wheel on every platform, but install
      # the system library on Linux too as a belt-and-braces fallback.
      - name: Install libsndfile (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libsndfile1

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install pyinstaller

      - name: Build executable
        run: pyinstaller rhythm_detection.spec

      # Give each OS's binary a unique name so Release assets don't collide.
      - name: Stage binary
        shell: bash
        run: |
          mkdir -p out
          if [ "$RUNNER_OS" = "Windows" ]; then
            cp dist/rhythm_detection.exe "out/rhythm_detection-windows.exe"
          elif [ "$RUNNER_OS" = "macOS" ]; then
            cp dist/rhythm_detection "out/rhythm_detection-macos"
          else
            cp dist/rhythm_detection "out/rhythm_detection-linux"
          fi

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: rhythm_detection-${{ runner.os }}
          path: out/*
          if-no-files-found: error

  # Attach the binaries to a GitHub Release when a version tag is pushed.
  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/**/*
