name: Build executables

# Builds the standalone Rhythm Detector GUI for Linux, macOS and Windows.
# PyInstaller cannot cross-compile, so each build runs on its own native runner.
# Each artifact is a zip holding the application, a visible music_files/ folder
# with the two sample tracks, and a README-FIRST.txt explaining how to get past
# the OS's unsigned-application warning. Trigger manually from the Actions tab,
# or push a tag like "v1.0.0" to also publish the zips as a GitHub Release.
on:
  workflow_dispatch:
  push:
    branches:
      - main
    tags:
      - "v*"

# Supersede in-progress builds for the same ref, but never cancel a tag build:
# that one publishes the Release, so losing it half-way would leave a tag with
# an incomplete set of downloads attached.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  build:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      # soundfile ships libsndfile in its wheel on every platform, but install
      # the system library on Linux too as a belt-and-braces fallback. tk is a
      # hard requirement for this build (unlike the old CLI one): setup-python's
      # _tkinter is linked against the system libtk, which the runner image does
      # not carry on its own.
      - name: Install system libraries (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libsndfile1 python3-tk

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install pyinstaller

      # PyInstaller only *warns* about a module it cannot find, so without this
      # a runner with broken Tk would publish a GUI application that has no GUI.
      # Fail here instead, where the cause is obvious.
      - name: Verify Tk is importable
        run: python -c "import tkinter; print('Tk', tkinter.TkVersion)"

      - name: Build application
        run: pyinstaller rhythm_detector_gui.spec

      # Ad-hoc signature ("-" as the identity). This is not a Developer ID and
      # does not get past Gatekeeper on its own -- README-FIRST.txt covers that
      # -- but it is what lets the binary execute at all on Apple Silicon, where
      # the kernel refuses to run unsigned code. --deep is deprecated for
      # signing yet remains the only single command that also covers the nested
      # dylibs PyInstaller collects into the bundle.
      - name: Ad-hoc sign the app bundle (macOS)
        if: runner.os == 'macOS'
        run: |
          set -euo pipefail
          APP="dist/Rhythm Detector.app"
          codesign --force --deep --sign - "$APP"
          codesign --verify --deep --strict --verbose=2 "$APP"

      # Exercises the frozen binary's worker mode, which is the same code path
      # the GUI drives. A missing hidden import (matplotlib data, plot_handler,
      # libsndfile) produces a working window that fails on every run, and this
      # is the only place that would notice before a user did.
      - name: Smoke-test the frozen binary
        shell: bash
        run: |
          set -euo pipefail
          if [ "$RUNNER_OS" = "macOS" ]; then
            BIN="dist/Rhythm Detector.app/Contents/MacOS/RhythmDetector"
          elif [ "$RUNNER_OS" = "Windows" ]; then
            BIN="dist/RhythmDetector.exe"
          else
            BIN="dist/RhythmDetector"
          fi
          "$BIN" --run-detection music_files/pathfinder.mp3 | tee smoke.log
          grep -q "^TEMPO: " smoke.log
          grep -q "^SAVED: " smoke.log

      - name: Stage download folder
        shell: bash
        run: |
          set -euo pipefail
          STAGE="out/RhythmDetector"
          mkdir -p "$STAGE"
          # The visible copy of the tracks. They are also embedded in the binary,
          # so the application still works if this folder is left behind.
          cp -R music_files "$STAGE/music_files"
          case "$RUNNER_OS" in
            macOS)
              # ditto, not cp -R: preserves the bundle's symlinks, resource forks
              # and -- critically -- the signature applied above.
              ditto "dist/Rhythm Detector.app" "$STAGE/Rhythm Detector.app"
              cp packaging/README-macOS.txt "$STAGE/README-FIRST.txt"
              ;;
            Windows)
              cp dist/RhythmDetector.exe "$STAGE/"
              cp packaging/README-windows.txt "$STAGE/README-FIRST.txt"
              ;;
            *)
              cp dist/RhythmDetector "$STAGE/"
              chmod +x "$STAGE/RhythmDetector"
              cp packaging/README-linux.txt "$STAGE/README-FIRST.txt"
              ;;
          esac
          ls -la "$STAGE"

      # One zip per OS, each named so Release assets cannot collide. macOS uses
      # ditto because `zip` flattens the .app's symlinks and drops the signature,
      # which would leave the download broken in exactly the way this change is
      # meant to fix.
      - name: Package (macOS)
        if: runner.os == 'macOS'
        run: ditto -c -k --sequesterRsrc --keepParent out/RhythmDetector RhythmDetector-macos.zip

      - name: Package (Linux)
        if: runner.os == 'Linux'
        run: (cd out && zip -r ../RhythmDetector-linux.zip RhythmDetector)

      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: Compress-Archive -Path out/RhythmDetector -DestinationPath RhythmDetector-windows.zip

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: RhythmDetector-${{ runner.os }}
          path: RhythmDetector-*.zip
          if-no-files-found: error

  # Attach the zips to a GitHub Release when a version tag is pushed.
  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/**/*.zip
